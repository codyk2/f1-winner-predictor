name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # tags too, so the "unchanged since v1.0" test can run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src tests
      # The raw data is not in the repository, so CI runs the leakage tests on
      # the synthetic championship. `make test` also runs them on real sessions.
      - name: Leakage and pipeline tests
        run: pytest -q
